version: '3.8'

services:
  # Backend Node.js/Express Service
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.backend
    container_name: rag_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      RAG_SERVICE_URL: http://rag-service:5000
    depends_on:
      - rag-service
    volumes:
      - ./1_backend:/app/backend
      - /app/backend/node_modules
    networks:
      - rag_network
    restart: unless-stopped

  # Python RAG Service
  rag-service:
    build:
      context: .
      dockerfile: ./Dockerfile.rag
    container_name: rag_service
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
    volumes:
      - ./5_gen\ ai--2:/app/rag
    networks:
      - rag_network
    restart: unless-stopped

networks:
  rag_network:
    driver: bridge
